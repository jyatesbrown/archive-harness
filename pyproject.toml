[project]
name = "archive-harness"
version = "0.1.0"
description = "Source-agnostic overwrite detector for public data sources"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
